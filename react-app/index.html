<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Strugure" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CRITICAL: Add theme-color meta tag immediately -->
    <meta name="theme-color" content="#0d1117" id="theme-color-meta">

    


    <!-- Inject theme color before paint - SIMPLIFIED VERSION -->
    <script>
    (function() {
      let theme = 'light';

      try {
        const saved = localStorage.getItem('theme');
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed?.state?.mode === 'dark' || parsed?.state?.mode === 'light') {
            theme = parsed.state.mode;
          }
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          theme = 'dark';
        }
      } catch (e) {
        console.warn('Failed to parse theme from localStorage', e);
      }

      const colors = { light: '#fafafa', dark: '#0d1117' };
      const bg = colors[theme] || '#0d1117';

      // Set theme-color meta tag immediately
      const metaThemeColor = document.getElementById('theme-color-meta');
      if (metaThemeColor) {
        metaThemeColor.setAttribute('content', bg);
      }

      // Apply minimal styles - NO overflow restrictions
      const style = document.createElement('style');
      style.innerHTML = `
        html, #preloader {
          background-color: ${bg} !important;
        }
        body {
          background-color: ${bg} !important;
          min-height: 100vh;
          min-height: -webkit-fill-available;
        }
      `;
      document.head.appendChild(style);

      // Set data-theme on html
      document.documentElement.setAttribute('data-theme', theme);
      
      // Set inline styles
      document.documentElement.style.backgroundColor = bg;
      document.body.style.backgroundColor = bg;
    })();
    </script>

    <style>
      /* Reset only essential styles */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        min-height: 100vh;
        min-height: -webkit-fill-available;
      }

      #preloader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }

      #preloader-icon {
        width: 120px;
        height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #preloader-icon img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        /* Direct CSS color property - simpler and more accurate */
        /* This will work if your icon is an SVG, but for PNG we need filter */
        /* For PNG with black icon, keep the filter but make it fully opaque */
        filter: 
          brightness(0) 
          saturate(100%) 
          invert(28%) 
          sepia(85%) 
          saturate(2400%) 
          hue-rotate(196deg) 
          brightness(94%) 
          contrast(102%);
        /* Remove opacity(0.83) to make it fully opaque #2574ebff */
        animation: pulse 1s ease-in-out infinite;
      }

      @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.1); }
        100% { transform: scale(1); }
      }
    </style>
  </head>

  <body>
    <div id="preloader">
      <div id="preloader-icon">
        <img src="src/assets/icon.png" alt="Strugure Icon" />
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Optional: Add a script to verify the color -->
    <script>
      // Verify the filter produces #2574eb
      console.log('Preloader icon color target: #2574ebff');
      console.log('RGB equivalent: rgb(37, 116, 235)');
    </script>
  </body>
</html>
